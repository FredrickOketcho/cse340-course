services:
  - type: web
    name: cse340-service-network
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cse340-service-network-db
          property: connectionString

databases:
  - name: cse340-service-network-db
    databaseName: cse340_service_network
    user: cse340_service_network
    plan: free
